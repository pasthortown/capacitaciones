<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Liquidación por Desvinculación</title>
  <style>
    /* ===== Tipografías oficiales (§6.1 instrucciones.md) ===== */
    @font-face { font-family: 'Uni Sans'; src: url('./fonts/UniSans/UniSans-Thin.otf') format('opentype');       font-weight: 100; font-style: normal; }
    @font-face { font-family: 'Uni Sans'; src: url('./fonts/UniSans/UniSans-ThinItalic.otf') format('opentype'); font-weight: 100; font-style: italic; }
    @font-face { font-family: 'Uni Sans'; src: url('./fonts/UniSans/UniSans-Heavy.otf') format('opentype');      font-weight: 900; font-style: normal; }
    @font-face { font-family: 'Uni Sans'; src: url('./fonts/UniSans/UniSans-HeavyItalic.otf') format('opentype'); font-weight: 900; font-style: italic; }

    @font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat/Montserrat-Light.ttf') format('truetype');    font-weight: 300; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat/Montserrat-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat/Montserrat-Italic.ttf') format('truetype');  font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat/Montserrat-Medium.ttf') format('truetype');  font-weight: 500; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat/Montserrat-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat/Montserrat-Bold.ttf') format('truetype');    font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat/Montserrat-BoldItalic.ttf') format('truetype'); font-weight: 700; font-style: italic; }

    @font-face { font-family: 'Plus Jakarta Sans'; src: url('./fonts/PlusJakartaSans/PlusJakartaSans-Regular.otf') format('opentype'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('./fonts/PlusJakartaSans/PlusJakartaSans-Italic.otf') format('opentype');  font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('./fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.otf') format('opentype'); font-weight: 600; font-style: normal; }
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('./fonts/PlusJakartaSans/PlusJakartaSans-SemiBoldItalic.otf') format('opentype'); font-weight: 600; font-style: italic; }
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('./fonts/PlusJakartaSans/PlusJakartaSans-Bold.otf') format('opentype');   font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('./fonts/PlusJakartaSans/PlusJakartaSans-BoldItalic.otf') format('opentype'); font-weight: 700; font-style: italic; }

    /* ===== Página ===== */
    @page { size: A4 landscape; margin: 12mm; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0 1.5mm;
      font-family: 'Montserrat', Arial, sans-serif;
      color: #1a1a1a;
      font-size: 9pt;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ===== Header oficial ===== */
    .page-header {
      border: 1px solid #221E20;
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 4mm;
    }
    .page-header td {
      border: 1px solid #221E20;
      vertical-align: middle;
      padding: 2mm 3mm;
    }
    .page-header .logo-cell { width: 36mm; text-align: center; padding: 2mm; }
    .page-header .logo-cell img { width: 28mm; height: auto; object-fit: contain; }
    .page-header .title-cell {
      text-align: center;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      font-weight: 700;
      font-size: 13pt;
      letter-spacing: 0.4px;
      color: #221E20;
    }
    .page-header .meta-cell {
      width: 52mm;
      font-size: 8.5pt;
      line-height: 1.4;
    }
    .page-header .meta-cell .lbl { color: #77787B; text-transform: uppercase; font-size: 7.5pt; letter-spacing: 0.3px; }
    .page-header .meta-cell .fecha-salida { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 700; font-size: 10.5pt; color: #E20000; }
    .red-bar { height: 3px; background: #E20000; margin-bottom: 4mm; }

    /* ===== Datos del colaborador ===== */
    .colab-box {
      border: 1px solid #e2e2e2;
      border-left: 4px solid #E20000;
      border-radius: 3px;
      padding: 2.6mm 4mm;
      margin-bottom: 4mm;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5mm 6mm;
      background: #fafafa;
    }
    .colab-box .cf label {
      font-size: 7.5pt; color: #77787B;
      text-transform: uppercase; letter-spacing: 0.3px; display: block;
    }
    .colab-box .cf span { font-size: 10pt; font-weight: 600; }

    /* ===== Banda de fecha de desvinculación (prominente) ===== */
    .desvinculacion-banner {
      border: 1.5px solid #E20000;
      border-radius: 4px;
      background: #feeded;
      padding: 2.8mm 5mm;
      margin-bottom: 4mm;
      display: flex;
      align-items: baseline;
      gap: 4mm;
    }
    .desvinculacion-banner .lbl {
      font-size: 8.5pt; color: #77787B;
      text-transform: uppercase; letter-spacing: 0.4px; font-weight: 700;
    }
    .desvinculacion-banner .val {
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      font-weight: 700; font-size: 14pt; color: #E20000;
    }

    /* ===== Tabla de convenios ===== */
    .conv {
      width: 100%;
      border: 1px solid #221E20;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .conv th, .conv td {
      border: 1px solid #cfcfcf;
      padding: 1.6mm 2mm;
      font-size: 8.5pt;
      vertical-align: top;
      word-wrap: break-word;
    }
    .conv thead th {
      background: #221E20; color: #fff;
      font-weight: 700; text-transform: uppercase;
      font-size: 7.5pt; letter-spacing: 0.3px;
      text-align: center;
      vertical-align: middle;
    }
    .conv .num { text-align: right; white-space: nowrap; }
    .conv .center { text-align: center; }
    .conv .reintegro-cell { color: #E20000; font-weight: 700; }
    .conv tbody tr:nth-child(even) { background: #f7f7f7; }
    .conv tfoot td {
      font-weight: 700;
      background: #fde6e6;
      color: #E20000;
      font-size: 9.5pt;
    }
    .conv .col-cod    { width: 9%; }
    .conv .col-titulo { width: 18%; }
    .conv .col-marca  { width: 8%; }
    .conv .col-clas   { width: 11%; }
    .conv .col-mod    { width: 12%; }
    .conv .col-fing   { width: 9%; }
    .conv .col-mes    { width: 7%; }
    .conv .col-mon    { width: 9%; }
  </style>
</head>
<body>
  <table class="page-header">
    <tr>
      <td class="logo-cell"><img src="./logotipo-DOS-Color.png" alt="DOS" /></td>
      <td class="title-cell">Liquidación por Desvinculación</td>
      <td class="meta-cell"><span class="lbl">Fecha de desvinculación</span><br/><span class="fecha-salida">{{fechaSalida}}</span></td>
    </tr>
  </table>
  <div class="red-bar"></div>

  <div class="desvinculacion-banner">
    <span class="lbl">Fecha de desvinculación</span>
    <span class="val">{{fechaSalida}}</span>
  </div>

  {{colaboradorBox}}

  {{tablaConvenios}}
</body>
</html>
