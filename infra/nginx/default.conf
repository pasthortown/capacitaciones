server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers por defecto a nivel server. Los locations que declaran
    # sus propios `add_header` deben incluir el snippet `security-headers.conf`
    # para que también emitan estos headers (nginx no los hereda en ese caso).
    include /etc/nginx/snippets/security-headers.conf;

    # Tamano maximo de upload (aplica al endpoint /api/recursos y todos los locations).
    client_max_body_size 100M;

    # Proxy al backend. NO stripear /api: las rutas del backend llevan el prefijo /api
    # (ej. [Route("api/auth")]). Sin el slash final en proxy_pass, nginx reenvía el URI tal cual.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cache agresiva para assets con hash (Vite genera nombres con hash)
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # No cachear el HTML de entrada
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # SPA fallback
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Pagina de error fallback
    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        include /etc/nginx/snippets/security-headers.conf;
        root   /usr/share/nginx/html;
    }
}
