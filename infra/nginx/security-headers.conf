# Snippet reutilizable con headers de seguridad. Se incluye en cada `location`
# del `default.conf` porque nginx NO hereda `add_header` de server→location
# cuando el location declara su propio `add_header`.
#
# Todos los headers se emiten también en respuestas de error (`always`) para
# cumplir el baseline de OWASP ZAP.

add_header X-Content-Type-Options     "nosniff" always;
add_header X-Frame-Options            "SAMEORIGIN" always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# CSP ajustado a la SPA actual:
#  - `'self'` para todo lo propio.
#  - `style-src 'unsafe-inline'` porque el bundle Vite y SweetAlert2 inyectan
#    estilos inline; una migración futura a `nonce` lo endurecería.
#  - `img-src` acepta data: (favicons base64) y blob: (previsualizaciones de
#    firma/upload generadas con `URL.createObjectURL`).
#  - `connect-src 'self'` cubre el proxy `/api/*` al backend.
#  - `frame-ancestors 'self'` complementa a `X-Frame-Options`.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
