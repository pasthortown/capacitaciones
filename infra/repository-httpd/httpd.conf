# httpd.conf minimal para servir /usr/local/apache2/htdocs (volumen compartido
# con backend en /repository). Solo carga los modulos estrictamente necesarios.

ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

# --- Modulos minimos ---
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so

# --- Usuario/grupo de runtime (imagen alpine define 'www-data') ---
<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

# --- Logs a stdout/stderr (buenas practicas Docker) ---
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

# --- MIME types ---
TypesConfig conf/mime.types
AddType application/octet-stream .bin

# --- DirectoryIndex (no listamos, pero respondemos index.html si existe) ---
<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

# --- Politica por defecto: denegar ---
<Directory />
    AllowOverride None
    Require all denied
</Directory>

# --- DocumentRoot ---
DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# --- Alias /imagenes -> volumen imagen_capacitaciones (logos de capacitaciones) ---
Alias /imagenes /usr/local/apache2/htdocs/imagenes
<Directory "/usr/local/apache2/htdocs/imagenes">
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# --- Ocultar archivos .gitkeep, .env, dotfiles ---
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
