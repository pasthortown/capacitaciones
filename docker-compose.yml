version: "3.9"

networks:
  capacitaciones-net:
    name: capacitaciones-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.56.0/24
  # Red compartida creada por /Docker/web (ingress nginx reverse-proxy).
  # El backend y repository_httpd se enganchan aquí para que el web-nginx
  # los alcance por nombre de contenedor. Se declara external para que este
  # compose no intente crearla.
  web-net:
    name: web-net
    external: true

volumes:
  sqlserver-data:
  sonar-db-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:

services:
  # Nginx "standalone": sólo para levantar el proyecto en modo self-contained
  # (ej. dev local). En prod, el ingress es /Docker/web/web-nginx, así que
  # este servicio NO se arranca si no se pasa `--profile standalone`.
  nginx:
    image: nginx:alpine
    container_name: capacitaciones-nginx
    restart: unless-stopped
    profiles: ["standalone"]
    depends_on:
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.10

  backend:
    build:
      context: .
      dockerfile: ./infra/backend/Dockerfile
    container_name: capacitaciones-backend
    restart: unless-stopped
    depends_on:
      - sqlserver
      - emisor_documentos
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:8080"
    environment:
      # Dev mode habilita db.Database.Migrate() y SeedInitialAdminAsync en Program.cs.
      # También expone Swagger. Trade-off aceptado para arranque local (Fase 5).
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EmisorDocumentos__BaseUrl: http://emisor_documentos:3000
      EmisorReportes__BaseUrl: http://emisor_reportes:5000
      MailSender__BaseUrl: http://mail_sender:8000
      Notifications__PublicBaseUrl: ${PUBLIC_BASE_URL}
      REPOSITORIO_DIR: /repository
      IMAGEN_CAPACITACIONES_DIR: /imagen_capacitaciones
    volumes:
      - ./output:/output
      - ./repository:/repository
      - ./imagen_capacitaciones:/imagen_capacitaciones
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.11
      web-net:
        ipv4_address: 192.168.52.11

  repository_httpd:
    image: httpd:2.4-alpine
    container_name: capacitaciones-repository-httpd
    restart: unless-stopped
    volumes:
      - ./repository:/usr/local/apache2/htdocs:ro
      - ./imagen_capacitaciones:/usr/local/apache2/htdocs/imagenes:ro
      - ./infra/repository-httpd/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.17
      web-net:
        ipv4_address: 192.168.52.12

  emisor_documentos:
    build:
      context: ./emisor_documentos
      dockerfile: Dockerfile
    container_name: capacitaciones-emisor
    restart: unless-stopped
    environment:
      TZ: America/Guayaquil
      PORT: 3000
      OUTPUT_DIR: /output
      TEMPLATES_DIR: /app/templates
      IMAGEN_CAPACITACIONES_DIR: /imagen_capacitaciones
    volumes:
      - ./output:/output
      - ./imagen_capacitaciones:/imagen_capacitaciones:ro
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.16

  # Servicio Python para generar el PDF del dashboard de resultados de encuesta
  # (matplotlib para las gráficas + reportlab para la composición del PDF).
  emisor_reportes:
    build:
      context: ./emisor_reportes
      dockerfile: Dockerfile
    container_name: capacitaciones-emisor-reportes
    restart: unless-stopped
    environment:
      TZ: America/Guayaquil
      PORT: 5000
      OUTPUT_DIR: /output
      ASSETS_DIR: /app/assets
    volumes:
      - ./output:/output
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.18

  # Daemon Python que monitorea capacitaciones y dispara correos masivos:
  # recordatorio pre-evento, aviso de inicio y encuesta de satisfacción.
  # Antiduplicado vía tabla `mail_control` en la BD (auto-creada).
  event_monitor:
    build:
      context: ./event_monitor
      dockerfile: Dockerfile
    container_name: capacitaciones-event-monitor
    restart: unless-stopped
    depends_on:
      - sqlserver
      - mail_sender
    environment:
      TZ: America/Guayaquil
      SQL_SERVER: sqlserver
      SQL_PORT: 1433
      SQL_DATABASE: Capacitaciones
      SQL_USER: sa
      SQL_PASSWORD: ${SA_PASSWORD}
      MAIL_SENDER_URL: http://mail_sender:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      EMAIL_DOMAIN: "@dos.com.ec"
      POLL_INTERVAL_SECONDS: 60
      BATCH_SIZE: 5
      WINDOW_PRE_EVENT_MIN: 30
      WINDOW_POST_START_MIN: 30
      WINDOW_POST_END_HOURS: 24
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.20

  # Servicio FastAPI para envío de correos (SMTP + plantillas Jinja2).
  # No se expone al host: lo consume el backend por red interna en :8000.
  # Credenciales SMTP via .env global; `plantillas/` montado como volumen
  # para edición en caliente sin reconstruir la imagen.
  mail_sender:
    build:
      context: ./mail_sender
      dockerfile: Dockerfile
    container_name: capacitaciones-mail-sender
    restart: unless-stopped
    environment:
      TZ: America/Guayaquil
      TEMPLATES_DIR: /app/plantillas
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      LOGO_URL: ${LOGO_URL}
    volumes:
      - ./mail_sender/plantillas:/app/plantillas
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.19

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: capacitaciones-sqlserver
    restart: unless-stopped
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.12

  sonar-db:
    image: postgres:15
    container_name: capacitaciones-sonar-db
    restart: unless-stopped
    profiles: ["security"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.14

  sonarqube:
    image: sonarqube:lts-community
    container_name: capacitaciones-sonarqube
    restart: unless-stopped
    profiles: ["security"]
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.13

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: capacitaciones-zap
    restart: unless-stopped
    profiles: ["security"]
    # Puerto del host 8091 (8090 lo usa otro proyecto local `lsvecino-frontend`).
    # Internamente el daemon sigue escuchando en 8090 dentro del contenedor.
    ports:
      - "8091:8090"
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=${ZAP_API_KEY}
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.15
