version: "3.9"

networks:
  capacitaciones-net:
    name: capacitaciones-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.56.0/24

volumes:
  sqlserver-data:
  sonar-db-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:

services:
  nginx:
    image: nginx:alpine
    container_name: capacitaciones-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.10

  backend:
    build:
      context: .
      dockerfile: ./infra/backend/Dockerfile
    container_name: capacitaciones-backend
    restart: unless-stopped
    depends_on:
      - sqlserver
    ports:
      - "8080:8080"
    environment:
      # Dev mode habilita db.Database.Migrate() y SeedInitialAdminAsync en Program.cs.
      # También expone Swagger. Trade-off aceptado para arranque local (Fase 5).
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.11

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: capacitaciones-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.12

  sonar-db:
    image: postgres:15
    container_name: capacitaciones-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.14

  sonarqube:
    image: sonarqube:lts-community
    container_name: capacitaciones-sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.13

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: capacitaciones-zap
    restart: unless-stopped
    ports:
      - "8090:8090"
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=${ZAP_API_KEY}
    networks:
      capacitaciones-net:
        ipv4_address: 192.168.56.15
